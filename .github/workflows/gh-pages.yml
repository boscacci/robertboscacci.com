name: Production GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated version tag with an approved, dev-tested release asset
        required: true
        type: string
      sha256:
        description: SHA-256 of the approved site.tar.gz artifact
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Download and verify approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_HASH: ${{ inputs.sha256 }}
        run: |
          mkdir -p release public
          gh release download "$RELEASE_TAG" --pattern site.tar.gz --pattern release.json --dir release
          node scripts/site-release.mjs "$RELEASE_TAG" "$EXPECTED_HASH" release
          tar -xzf release/site.tar.gz -C public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Promote the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
