                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

                outline: 0;
                background: #235c4e;

                border: 0;

                color: #ffffff;
                font-size: 14px;
                cursor: pointer;

                margin-bottom: 1em;

                align-items: center;
                justify-content: center;
            }

                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;

                animation-timing-function: linear;
                animation-delay: 0s;

                    font-size: 16px;
                }
            }
